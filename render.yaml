services:
  - type: web
    name: projectflow-fsi-api
    runtime: node
    repo: https://github.com/vishwajeethshikari/project-management-saas
    branch: feature/full-stack-integration
    rootDir: backend
    region: singapore
    plan: 0.5c-512mb
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    buildFilter:
      includedPaths:
        - backend/**
        - database/**
        - render.yaml
    disk:
      name: projectflow-attachments
      mountPath: /var/data/attachments
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 24.19.0
      - key: DATABASE_URL
        fromDatabase:
          name: projectflow-fsi-db
          property: connectionString
      - key: JWT_SECRET
        sync: false
      - key: JWT_EXPIRES_IN
        value: 1h
      - key: CLIENT_URL
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: ATTACHMENT_STORAGE_DIR
        value: /var/data/attachments
      - key: EMAIL_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false

  - type: web
    name: projectflow-fsi-web
    runtime: static
    repo: https://github.com/vishwajeethshikari/project-management-saas
    branch: feature/full-stack-integration
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    autoDeployTrigger: commit
    buildFilter:
      includedPaths:
        - frontend/**
        - render.yaml
    envVars:
      - key: NODE_VERSION
        value: 24.19.0
      - key: VITE_API_URL
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

databases:
  - name: projectflow-fsi-db
    databaseName: projectflow
    plan: 0.1c-256mb
    region: singapore
    postgresMajorVersion: "17"
